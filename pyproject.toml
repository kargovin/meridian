[project]
name = "meridian"
version = "0.1.0"
description = "Meridian News — the aggregator app (ingest → dedup → cluster → serve)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "meridian-contract",
    "meridian-config",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.workspace]
members = ["libs/contract", "libs/config"]

[tool.uv.sources]
meridian-contract = { workspace = true }
meridian-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]

# --------------------------------------------------------------------------- tooling (T9)
[tool.ruff]
line-length = 100
target-version = "py312"
# The Confluence publishing toolchain is local tooling, not shipped in either deployable,
# and predates this config.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated; the long lines are op.create_table() argument lists.
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# A2's seams are "typed interfaces, no shared mutable state" — strict where that claim lives.
[[tool.mypy.overrides]]
module = ["meridian.db.*", "meridian_contract.*", "meridian_config.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a real PostgreSQL (SKIP LOCKED and partial indexes do not exist on SQLite)",
]
