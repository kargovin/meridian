[project]
name = "meridian"
version = "0.1.0"
description = "Meridian News — the aggregator app (ingest → dedup → cluster → serve)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "meridian-contract",
    "meridian-config",
    "meridian-dbkit",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Discovery. httpx2 rather than httpx: it is the successor, and starlette's TestClient
    # already prefers it, so adding httpx would put two HTTP stacks in the image.
    "httpx2>=2.10",
    "feedparser>=6.0.11",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.workspace]
# `platform` is a member but deliberately NOT a dependency: the application must not depend
# on the Platform. Install everything with `uv sync --all-packages`.
members = ["libs/contract", "libs/config", "libs/dbkit", "platform"]

[tool.uv.sources]
meridian-contract = { workspace = true }
meridian-config = { workspace = true }
meridian-dbkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]

# --------------------------------------------------------------------------- tooling (T9)
[tool.ruff]
line-length = 100
target-version = "py312"
# The Confluence publishing toolchain is local tooling, not shipped in either deployable,
# and predates this config.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated; the long lines are op.create_table() argument lists.
"migrations/versions/*" = ["E501"]
"platform/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# Neither ships stubs or a py.typed marker.
[[tool.mypy.overrides]]
module = ["feedparser.*", "apscheduler.*"]
ignore_missing_imports = true

# A2's seams are "typed interfaces, no shared mutable state" — strict where that claim lives.
[[tool.mypy.overrides]]
module = [
    "meridian.db.*",
    "meridian_contract.*",
    "meridian_config.*",
    "meridian_dbkit.*",
    "meridian_platform.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a real PostgreSQL (SKIP LOCKED and partial indexes do not exist on SQLite)",
]
