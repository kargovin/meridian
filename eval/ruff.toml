# Applies to this package only, on top of the root configuration.
#
# `extend` is not optional: a nested config file REPLACES the root one for the files beneath
# it, so without this line every rule the repository runs is silently switched off here.
extend = "../pyproject.toml"

[lint]
# banned-api below is inert unless TID is selected — present, plausible, and reporting
# nothing.
extend-select = ["TID"]

[lint.flake8-tidy-imports.banned-api]
# An eval set carries its own text, so a run never reads the database. That is what keeps a
# number reproducible: the same set at the same commit under the same config must score the
# same in six months, and it cannot if a column filled in underneath it. Matching is on
# dotted path components, so `meridian_config`, `meridian_contract` and `meridian_dbkit` are
# unaffected.
#
# This catches static imports only. A dynamic importlib call is invisible to it, which is
# why tests/test_eval_boundary.py exists as well.
"meridian".msg = "the harness must not read the application's data; an eval set carries its own text."
