# The importable package is `meridian_platform`, one level down. This directory is named
# `platform` and must stay a plain directory: an __init__.py here would make it a package
# that shadows the standard library's `platform` module.
[project]
name = "meridian-platform"
version = "0.1.0"
description = "The Summarization & Classification Platform — a stateless classify/summarize service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "meridian-config",
    "meridian-contract",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
meridian-config = { workspace = true }
meridian-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_platform"]
