# Dev PostgreSQL (T3). Production is a postgres:16 StatefulSet on the k3s cluster (T10).
services:
  postgres:
    image: postgres:16
    container_name: meridian-postgres
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "${MERIDIAN_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
