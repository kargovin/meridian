name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The schema tests need SKIP LOCKED and partial indexes; neither exists on SQLite, so a
    # suite that runs without this service proves nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MERIDIAN_DATABASE_URL: postgresql+psycopg://meridian:meridian@localhost:5432/meridian

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --all-packages: the Platform is a workspace member but not a dependency of the app,
      # so a plain sync would leave it uninstalled.
      - run: uv sync --locked --all-packages

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy meridian platform libs tests

      # Includes the check that autogenerate finds no difference between the models and the
      # migrated database.
      - name: pytest
        run: uv run pytest -q
