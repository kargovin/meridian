[project]
name = "meridian-dbkit"
version = "0.1.0"
description = "Column types and constraint conventions shared by both deployables' schemas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_dbkit"]
