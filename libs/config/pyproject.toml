[project]
name = "meridian-config"
version = "0.1.0"
description = "Process bootstrap configuration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_config"]
